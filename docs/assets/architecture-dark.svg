<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" role="img" aria-label="Two-layer architecture: any AI conversation loads only the runtime layer, then acts within governance; deeper layers load on demand and you remain the only approver.">
  <defs>
    <marker id="arw-d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" class="arwfill"/>
    </marker>
  </defs>
  <style>
    .bg{fill:#0f141a;}
    .card{fill:#1b222b;stroke:#30363d;stroke-width:1.5;}
    .card-d{fill:#161c24;stroke:#3a4552;stroke-width:1.5;stroke-dasharray:5 5;}
    .layer{fill:#13202f;stroke:#2b3f5a;stroke-width:1.5;}
    .pill{fill:#1b222b;stroke:#3a434e;stroke-width:1.5;}
    .accent{fill:#122642;stroke:#3987e5;stroke-width:1.75;}
    .you{fill:#e6edf3;stroke:#e6edf3;}
    text{fill:#e6edf3;}
    .title{font-weight:600;}
    .sub{fill:#adbac7;}
    .muted{fill:#768390;}
    .you-t{fill:#0f141a;}
    .you-s{fill:#3a434e;}
    .edge{fill:none;stroke:#5b6672;stroke-width:1.75;}
    .edge-d{fill:none;stroke:#48525f;stroke-width:1.75;stroke-dasharray:5 5;}
    .arwfill{fill:#5b6672;}
  </style>

  <rect x="2" y="2" width="876" height="436" rx="16" class="bg"/>

  <!-- entry -->
  <rect x="260" y="26" width="360" height="42" rx="21" class="pill"/>
  <text x="440" y="52" text-anchor="middle" font-size="14.5" class="title">Any AI conversation picks up a task</text>
  <path d="M440,68 V92" class="edge" marker-end="url(#arw-d)"/>

  <!-- runtime layer -->
  <rect x="40" y="98" width="800" height="110" rx="14" class="layer"/>
  <text x="64" y="126" font-size="15" class="title">runtime/ — the only layer an everyday task loads</text>
  <rect x="64" y="146" width="168" height="48" rx="10" class="card"/>
  <text x="148" y="169" text-anchor="middle" font-size="14" class="title">00 · entry</text>
  <text x="148" y="186" text-anchor="middle" font-size="11.5" class="sub">classify</text>
  <rect x="262" y="146" width="168" height="48" rx="10" class="card"/>
  <text x="346" y="169" text-anchor="middle" font-size="14" class="title">router</text>
  <text x="346" y="186" text-anchor="middle" font-size="11.5" class="sub">which files</text>
  <rect x="460" y="146" width="168" height="48" rx="10" class="card"/>
  <text x="544" y="169" text-anchor="middle" font-size="14" class="title">core rules</text>
  <text x="544" y="186" text-anchor="middle" font-size="11.5" class="sub">GOV-001~012</text>
  <rect x="658" y="146" width="168" height="48" rx="10" class="card"/>
  <text x="742" y="175" text-anchor="middle" font-size="14" class="title">your profile</text>
  <path d="M232,170 H260" class="edge" marker-end="url(#arw-d)"/>
  <path d="M430,170 H458" class="edge" marker-end="url(#arw-d)"/>
  <path d="M628,170 H656" class="edge" marker-end="url(#arw-d)"/>
  <path d="M440,208 V236" class="edge" marker-end="url(#arw-d)"/>

  <!-- act -->
  <rect x="310" y="236" width="260" height="42" rx="21" class="accent"/>
  <text x="440" y="262" text-anchor="middle" font-size="14.5" class="title">Act within governance</text>

  <!-- fork -->
  <path d="M440,278 V306 H255 V330" class="edge-d" marker-end="url(#arw-d)"/>
  <path d="M440,278 V306 H625 V330" class="edge" marker-end="url(#arw-d)"/>
  <text x="255" y="300" text-anchor="middle" font-size="10.5" class="muted">on risk · structural · incident</text>
  <text x="625" y="300" text-anchor="middle" font-size="10.5" class="muted">every task</text>

  <!-- on-demand -->
  <rect x="90" y="334" width="330" height="84" rx="12" class="card-d"/>
  <text x="255" y="368" text-anchor="middle" font-size="13.5" class="sub" font-weight="600">Loaded only on demand</text>
  <text x="255" y="392" text-anchor="middle" font-size="12" class="muted">core/ full charter · docs/ handbooks</text>

  <!-- you -->
  <rect x="460" y="334" width="330" height="84" rx="12" class="you"/>
  <text x="625" y="368" text-anchor="middle" font-size="14.5" class="you-t" font-weight="600">You decide</text>
  <text x="625" y="392" text-anchor="middle" font-size="12" class="you-s">direction · deletion · publishing</text>
</svg>
