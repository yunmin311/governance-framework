<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" role="img" aria-label="Task routing: every task is classified into QUICK, NORMAL, STRUCTURAL, or INCIDENT; each returns a three-line receipt, with STRUCTURAL passing an approver gate.">
  <defs>
    <marker id="rarw-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" class="arwfill"/>
    </marker>
  </defs>
  <style>
    .bg{fill:#eef2f6;}
    .pill{fill:#ffffff;stroke:#c9d1d9;stroke-width:1.5;}
    .accent{fill:#eaf1fb;stroke:#2a78d6;stroke-width:1.75;}
    text{fill:#1c2128;}
    .title{font-weight:600;}
    .sub{fill:#57606a;}
    .muted{fill:#8b949e;}
    .edge{fill:none;stroke:#9aa4af;stroke-width:1.75;}
    .arwfill{fill:#9aa4af;}
    .m-quick{fill:#e7f5ec;stroke:#0ca30c;stroke-width:1.75;}
    .m-normal{fill:#e8f1fc;stroke:#2a78d6;stroke-width:1.75;}
    .m-struct{fill:#fdf3d9;stroke:#d99a00;stroke-width:1.75;}
    .m-incid{fill:#fce9e7;stroke:#d03b3b;stroke-width:1.75;}
    .tag-quick{fill:#0ca30c;} .tag-normal{fill:#2a78d6;} .tag-struct{fill:#c78a00;} .tag-incid{fill:#d03b3b;}
  </style>

  <rect x="2" y="2" width="876" height="456" rx="16" class="bg"/>

  <!-- new task -->
  <rect x="350" y="22" width="180" height="38" rx="19" class="pill"/>
  <text x="440" y="46" text-anchor="middle" font-size="14" class="title">New task</text>
  <path d="M440,60 V74" class="edge" marker-end="url(#rarw-l)"/>

  <!-- classify diamond -->
  <polygon points="440,76 524,110 440,144 356,110" class="pill"/>
  <text x="440" y="106" text-anchor="middle" font-size="13.5" class="title">classify</text>
  <text x="440" y="123" text-anchor="middle" font-size="10.5" class="muted">runtime/00-entry</text>

  <!-- fan arrows -->
  <path d="M440,144 L125,188" class="edge" marker-end="url(#rarw-l)"/>
  <path d="M440,144 L335,188" class="edge" marker-end="url(#rarw-l)"/>
  <path d="M440,144 L545,188" class="edge" marker-end="url(#rarw-l)"/>
  <path d="M440,144 L755,188" class="edge" marker-end="url(#rarw-l)"/>

  <!-- QUICK -->
  <rect x="30" y="190" width="190" height="96" rx="12" class="m-quick"/>
  <rect x="30" y="190" width="190" height="6" rx="3" class="tag-quick"/>
  <text x="125" y="222" text-anchor="middle" font-size="16" class="title">QUICK</text>
  <text x="125" y="245" text-anchor="middle" font-size="11" class="sub">known file · reversible</text>
  <text x="125" y="264" text-anchor="middle" font-size="10.5" class="muted">3 files · ~3,800 chars</text>

  <!-- NORMAL -->
  <rect x="240" y="190" width="190" height="96" rx="12" class="m-normal"/>
  <rect x="240" y="190" width="190" height="6" rx="3" class="tag-normal"/>
  <text x="335" y="222" text-anchor="middle" font-size="16" class="title">NORMAL</text>
  <text x="335" y="245" text-anchor="middle" font-size="11" class="sub">routine project work</text>
  <text x="335" y="264" text-anchor="middle" font-size="10.5" class="muted">+ project canonical</text>

  <!-- STRUCTURAL -->
  <rect x="450" y="190" width="190" height="96" rx="12" class="m-struct"/>
  <rect x="450" y="190" width="190" height="6" rx="3" class="tag-struct"/>
  <text x="545" y="222" text-anchor="middle" font-size="16" class="title">STRUCTURAL</text>
  <text x="545" y="245" text-anchor="middle" font-size="11" class="sub">new machine / cross-project</text>
  <text x="545" y="264" text-anchor="middle" font-size="10.5" class="muted">declaration + gate</text>

  <!-- INCIDENT -->
  <rect x="660" y="190" width="190" height="96" rx="12" class="m-incid"/>
  <rect x="660" y="190" width="190" height="6" rx="3" class="tag-incid"/>
  <text x="755" y="222" text-anchor="middle" font-size="16" class="title">INCIDENT</text>
  <text x="755" y="245" text-anchor="middle" font-size="11" class="sub">conflict · leak risk</text>
  <text x="755" y="264" text-anchor="middle" font-size="10.5" class="muted">read-only · quarantine</text>

  <!-- converge to receipt -->
  <path d="M125,286 L432,388" class="edge" marker-end="url(#rarw-l)"/>
  <path d="M335,286 L432,388" class="edge" marker-end="url(#rarw-l)"/>
  <path d="M755,286 L448,388" class="edge" marker-end="url(#rarw-l)"/>

  <!-- structural -> gate -> receipt -->
  <path d="M545,286 V314" class="edge" marker-end="url(#rarw-l)"/>
  <rect x="485" y="316" width="120" height="34" rx="17" class="accent"/>
  <text x="545" y="338" text-anchor="middle" font-size="12.5" class="title">approver gate</text>
  <path d="M545,350 L455,388" class="edge" marker-end="url(#rarw-l)"/>

  <!-- receipt -->
  <rect x="290" y="390" width="300" height="52" rx="12" class="accent"/>
  <text x="440" y="414" text-anchor="middle" font-size="14.5" class="title">Receipt</text>
  <text x="440" y="432" text-anchor="middle" font-size="12" class="sub">Changed / Verified / Remaining</text>
</svg>
