schema_version: "1.0"
skill_id: external-ponytail-review
skill_name: Diff 复杂度审查（借鉴 ponytail-review 方法）
level: UNCLASSIFIED          # 仓库未定义 S 等级含义，本轮不擅填 S2
status: CANDIDATE
runtime_loading: DISABLED
retention_decision: PILOT_ONLY
purpose: 对当前 Git Diff 做“无必要复杂度 / 重复造轮子 / 推测性抽象”只读审查，产出候选简化建议
use_when:
  - 已有一个具体 Diff，想检查是否过度工程化
do_not_use_when:
  - 需要检查正确性 / 安全性 / 性能 / 视觉质量（本方法不做）
  - 想扫描整个仓库或让它自动改代码
inputs:
  - 当前 Git Diff 与少量直接上下文
required_reading:
  - launchers/候选-Diff复杂度审查-手动-非默认.txt
workflow:
  - 只读当前 Diff：查无必要复杂度 / 重复实现已有能力 / 可用标准库或平台原生 / 推测性抽象 / 单实现接口·无价值包装·不必要依赖
  - 每条发现标 CANDIDATE，不改文件、不 commit/push
output_contract: "Location / Evidence / Candidate simplification / Protected constraints / Risk；无发现输出 'Lean enough. No change recommended.'"
quality_checks:
  - 不削弱已批准 Spec / 项目架构 / 契约 / 测试 / 安全 / 数据保护
failure_handling:
  - 无可靠发现时明确输出 Lean enough，不硬凑建议
depends_on:
  - registry/sources.yaml#external-ponytail
conflicts_with: []
source_dialogues: []
source_documents:
  - external-ponytail (over-engineering review reference)
validation_records: []       # 待：v2.2.1 通过后用三个真实 Diff 单独试点
maintainer: 统领对话
version: v0.1-candidate
canonical_path: registry/skill-candidates/external-ponytail-review.yaml
context_cost: 低（只读 Diff，不进默认加载）
retention_decision_detail: PILOT_ONLY —— 只在 v2.2.1 通过后用 3 个真实 Diff 评估，不影响本版本通过
prohibited:
  - 安装完整 Ponytail 插件 / 接入 MCP / 启用 Hook
  - 注入所有代码任务 / 启用全仓 ponytail-audit
  - 加入 runtime 默认加载 / 让其自动改代码 / 决定功能范围·架构·删除·Git 操作
