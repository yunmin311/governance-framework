one_expression_rule: >
  以上每个 rule_id 的正式表达唯一存在于 runtime/01-core-rules.md。core/01 宪章是审计正本
  （保留完整条文），docs/ 手册是背景说明，adapter 是平台落地，均以 Rule ID 引用，不形成第二份可独立演化的规则。
